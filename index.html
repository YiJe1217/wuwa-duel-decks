<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>鳴潮：對決 牌組庫</title>
<meta name="description" content="《鳴潮：對決》實體 TCG 主流、守岸人、今汐牌組的卡表、打法與環境數據整理。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: sticky top bar with four views; one reading column (max 1080px); decks as dense rows, detail as a single sheet. */
:root {
  --bg: #eceff3; --surface: #ffffff; --surface-2: #f5f7f9; --ink: #161a21; --muted: #5a6371; --line: #d3d9e1;
  --accent: #8a6a1f; --accent-ink: #ffffff; --accent-soft: #f2e8cf;
  --red: #c13f2e; --red-soft: #f9e2de; --blue: #2c6cbf; --blue-soft: #dfeaf8; --green: #2b8754; --green-soft: #dcf0e4;
  --diff: #b58a1e; --aero: #1f8f84; --fusion: #d0632a; --glacio: #3f8fc9; --havoc: #8b4bb8;
  --good: #2b8754; --bad: #c13f2e; --scrim: rgba(12, 14, 18, 0.88);
  --font-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --font-body: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Heiti TC", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1217; --surface: #171b22; --surface-2: #1d222a; --ink: #e5e8ec; --muted: #9aa3b0; --line: #2b323c;
    --accent: #d4b36c; --accent-ink: #1a1508; --accent-soft: #2c2616;
    --red: #e46a5c; --red-soft: #3a201d; --blue: #6fa3ea; --blue-soft: #1b2a3f; --green: #5cc08a; --green-soft: #18311f;
    --diff: #dcb54e; --aero: #45c4b6; --fusion: #ec8a52; --glacio: #6fb6ea; --havoc: #b483dc;
    --good: #5cc08a; --bad: #e46a5c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1217; --surface: #171b22; --surface-2: #1d222a; --ink: #e5e8ec; --muted: #9aa3b0; --line: #2b323c;
  --accent: #d4b36c; --accent-ink: #1a1508; --accent-soft: #2c2616;
  --red: #e46a5c; --red-soft: #3a201d; --blue: #6fa3ea; --blue-soft: #1b2a3f; --green: #5cc08a; --green-soft: #18311f;
  --diff: #dcb54e; --aero: #45c4b6; --fusion: #ec8a52; --glacio: #6fb6ea; --havoc: #b483dc;
  --good: #5cc08a; --bad: #e46a5c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); text-underline-offset: 2px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--ink); }
.brand b { font-family: var(--font-display); font-size: 20px; letter-spacing: 0.04em; }
.brand span { font-size: 12px; color: var(--muted); letter-spacing: 0.06em; }
.tabs { display: flex; gap: 4px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
.tabs a { padding: 6px 12px; border-radius: 999px; text-decoration: none; color: var(--muted); font-weight: 600; white-space: nowrap; }
.tabs a[aria-current="page"] { background: var(--ink); color: var(--surface); }
@media (max-width: 560px) { .tabs { margin-left: 0; width: 100%; } .tabs a { flex: 1; text-align: center; padding: 6px 4px; } }

main { padding-block: 20px 56px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h1 { font-family: var(--font-display); font-size: clamp(22px, 4vw, 30px); line-height: 1.3; }
h2 { font-family: var(--font-display); font-size: 20px; }
h3 { font-size: 15px; }
.eyebrow { font-size: 12px; letter-spacing: 0.1em; color: var(--muted); font-weight: 700; }
.lede { color: var(--muted); margin: 6px 0 0; }
.stack { display: grid; gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
.panel > h2 { margin-bottom: 10px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* controls */
.controls { display: grid; gap: 10px; margin: 16px 0 12px; }
.search { display: flex; gap: 8px; }
.search input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 7px 12px; cursor: pointer; color: var(--muted); font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; line-height: 1.6; white-space: nowrap; }
button.chip { cursor: pointer; color: var(--ink); }
button.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--surface); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.el-diff { background: var(--diff); } .el-aero { background: var(--aero); } .el-fusion { background: var(--fusion); }
.el-glacio { background: var(--glacio); } .el-havoc { background: var(--havoc); }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
.count { font-size: 13px; color: var(--muted); }

/* deck list */
.decks { display: grid; gap: 8px; }
.deck { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; align-items: center; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); text-decoration: none; color: inherit; }
.deck:hover { border-color: var(--accent); }
.deck .main { min-width: 0; display: grid; gap: 4px; }
.deck .title { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.deck .title b { font-size: 16px; }
.id { font-family: var(--font-mono); font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; white-space: nowrap; }
.meta { font-size: 13px; color: var(--muted); display: flex; gap: 4px 12px; flex-wrap: wrap; }
.pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 4px; background: var(--accent-soft); color: var(--ink); line-height: 1.6; }
.pill.tp { background: var(--surface-2); border: 1px solid var(--line); font-family: var(--font-mono); }
.side { display: grid; justify-items: end; gap: 4px; }
@media (max-width: 560px) { .deck { grid-template-columns: 1fr; } .side { justify-items: start; } }

/* color bar: 40 action cards */
.cbar { display: flex; width: 160px; height: 8px; border-radius: 4px; overflow: hidden; background: var(--line); }
.cbar.big { width: 100%; height: 12px; }
.cbar i { display: block; height: 100%; }
.c-red { background: var(--red); } .c-blue { background: var(--blue); } .c-green { background: var(--green); }
.cnums { font-family: var(--font-mono); font-size: 12px; display: flex; gap: 10px; }
.cnums .r { color: var(--red); } .cnums .b { color: var(--blue); } .cnums .g { color: var(--green); }

/* deck detail */
.back { display: inline-block; margin-bottom: 12px; text-decoration: none; font-weight: 600; }
.sheet-head { display: grid; gap: 8px; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px 20px; margin: 0; }
.facts div { min-width: 0; }
.facts dt { font-size: 12px; color: var(--muted); letter-spacing: 0.05em; }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.copy { border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 0 8px; cursor: pointer; font-size: 12px; margin-left: 6px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
.plan { display: grid; gap: 12px; margin: 0; }
.plan dt { font-weight: 700; font-size: 13px; color: var(--accent); }
.plan dd { margin: 2px 0 0; }
.curve { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; align-items: end; height: 92px; }
.curve div { display: grid; grid-template-rows: 1fr auto auto; justify-items: center; height: 100%; font-size: 12px; }
.curve span.b { width: 70%; background: var(--accent); border-radius: 3px 3px 0 0; align-self: end; }
.curve em { font-style: normal; font-family: var(--font-mono); }

/* card rows */
.cgroup { display: grid; gap: 6px; }
.cgroup h3 { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.cgroup h3 .sw { width: 10px; height: 10px; border-radius: 2px; }
details.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
details.card > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 2.6em minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; }
details.card > summary::-webkit-details-marker { display: none; }
details.card[open] > summary { border-bottom: 1px solid var(--line); }
.qty { font-family: var(--font-mono); font-weight: 700; font-size: 15px; }
.cname { min-width: 0; display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; }
.cname b { font-weight: 600; }
.stats { font-family: var(--font-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.stats b { color: var(--ink); font-weight: 700; }
.cbody { padding: 10px 12px; display: grid; gap: 6px; font-size: 14px; }
.effect { white-space: pre-line; }
.note { font-size: 13px; color: var(--muted); border-left: 3px solid var(--accent-soft); padding-left: 8px; }
.edge-red { border-left: 4px solid var(--red) !important; }
.edge-blue { border-left: 4px solid var(--blue) !important; }
.edge-green { border-left: 4px solid var(--green) !important; }
.edge-none { border-left: 4px solid var(--line) !important; }

/* tables */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: 0.04em; white-space: nowrap; }
td.n { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.ubar { display: inline-block; height: 6px; background: var(--accent); border-radius: 3px; vertical-align: middle; margin-right: 6px; }
.wr-good { color: var(--good); font-weight: 700; } .wr-bad { color: var(--bad); }
details.fold > summary { cursor: pointer; font-weight: 700; padding: 4px 0; }
.list { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.empty { padding: 24px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); }
footer { color: var(--muted); font-size: 12px; padding-block: 24px; border-top: 1px solid var(--line); }

/* card art */
.cmedia { display: flex; gap: 14px; align-items: flex-start; }
.ctext { min-width: 0; flex: 1; display: grid; gap: 6px; align-content: start; }
.cfig { margin: 0; flex: none; width: 168px; display: grid; gap: 6px; }
.cimg { display: block; width: 100%; max-width: 100%; aspect-ratio: 1055 / 1473; object-fit: cover; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); cursor: zoom-in; }
.arts { display: flex; flex-wrap: wrap; gap: 4px; }
.art { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 0 6px; font-size: 11px; cursor: pointer; color: var(--muted); }
.art[aria-pressed="true"] { border-color: var(--accent); color: var(--ink); background: var(--accent-soft); }
.noimg { flex: none; width: 168px; max-width: 100%; aspect-ratio: 1055 / 1473; display: grid; place-items: center; text-align: center; padding: 8px; border: 1px dashed var(--line); border-radius: 6px; color: var(--muted); font-size: 12px; background: var(--surface-2); }
@media (max-width: 520px) { .cmedia { flex-direction: column; } .cfig, .noimg { width: min(220px, 70%); } }
.viewseg { margin-left: auto; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
.tile { margin: 0; position: relative; display: grid; gap: 4px; min-width: 0; }
.tile .cimg, .tile .noimg { width: 100%; }
.tile .badge { position: absolute; top: 6px; right: 6px; background: var(--ink); color: var(--surface); font-family: var(--font-mono); font-weight: 700; font-size: 13px; border-radius: 999px; padding: 0 8px; line-height: 1.7; }
.tile figcaption { font-size: 12px; line-height: 1.4; overflow-wrap: anywhere; }
.tile .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
.lb { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: grid; place-items: center;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); cursor: zoom-out; }
.lb img { max-width: 100%; max-height: 100%; width: auto; height: auto; border-radius: 10px; }
/* collection & missing */
.deckwrap { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.deckwrap:hover, .deckwrap.wanted { border-color: var(--accent); }
.deckwrap .deck { border: 0; background: none; }
.deckwrap > .want { margin-right: 14px; }
@media (max-width: 560px) { .deckwrap { grid-template-columns: 1fr; } .deckwrap > .want { justify-self: start; margin: 0 14px 12px; } }
.want { border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.want[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.want.big { padding: 6px 16px; font-size: 14px; }
.prog { display: inline-block; width: 80px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; vertical-align: middle; }
.prog i { display: block; height: 100%; background: var(--good); }
.progrow { display: inline-flex; align-items: center; gap: 6px; }
.own { font-family: var(--font-mono); font-size: 11px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--line); white-space: nowrap; }
.own-ok { color: var(--good); border-color: var(--good); }
.own-part { color: var(--accent); border-color: var(--accent); }
.own-none { color: var(--muted); }
.crow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.crow .cinfo { min-width: 0; }
.crow.has .step input { color: var(--good); font-weight: 700; }
.step { display: inline-flex; align-items: stretch; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.step button { width: 38px; min-height: 36px; border: 0; background: var(--surface-2); font-size: 18px; line-height: 1; cursor: pointer; color: var(--ink); }
.step button:active { background: var(--accent-soft); }
.step input { width: 46px; border: 0; border-inline: 1px solid var(--line); background: var(--surface); text-align: center; font-family: var(--font-mono); font-size: 15px; -moz-appearance: textfield; appearance: textfield; }
.step input::-webkit-outer-spin-button, .step input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.lack { font-weight: 700; color: var(--bad); }
.lack.ok { color: var(--good); }
.wantrow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.wantrow a { text-decoration: none; color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
@media (max-width: 560px) { .wantrow { grid-template-columns: minmax(0, 1fr) auto; } .wantrow .progrow { grid-column: 1; } }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 8px; padding: 6px 12px; font-weight: 600; cursor: pointer; font-size: 14px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); }
.btn.small { padding: 3px 10px; font-size: 13px; }
.ta { width: 100%; min-height: 72px; margin: 8px 0; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--surface); font-family: var(--font-mono); font-size: 12px; word-break: break-all; resize: vertical; }
.notice { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 12px; margin-top: 8px; }
.notice p { margin: 0 0 8px; }
.notice.bad { border-color: var(--bad); background: var(--red-soft); }
/* rules */
.rules { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; align-items: start; margin-top: 16px; }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); max-height: calc(100vh - 100px); overflow: auto; font-size: 14px; }
.toc ol { margin: 0; padding-left: 1.4em; display: grid; gap: 4px; }
.toc a { text-decoration: none; color: var(--ink); }
.toc a:hover { color: var(--accent); }
@media (max-width: 860px) { .rules { grid-template-columns: 1fr; } .toc { position: static; max-height: none; } }
.rdoc { min-width: 0; display: grid; gap: 16px; }
.rdoc section { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 84px); min-width: 0; }
.rdoc h2 { margin-bottom: 8px; }
.rdoc h3 { margin: 14px 0 4px; font-size: 15px; color: var(--accent); }
.rdoc p { margin: 6px 0; max-width: 72ch; }
.rdoc ul, .rdoc ol { margin: 6px 0; padding-left: 1.3em; display: grid; gap: 4px; max-width: 72ch; }
.rdoc .ex { font-size: 14px; color: var(--muted); border-left: 3px solid var(--accent-soft); padding-left: 10px; margin: 8px 0; max-width: 72ch; }
.rdoc .warnbox { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; margin: 8px 0; max-width: 72ch; }
.kbd { font-family: var(--font-mono); font-size: 13px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; white-space: nowrap; }
.flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; margin: 10px 0; }
.flow div { flex: 1 1 120px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface-2); min-width: 0; }
.flow b { display: block; font-size: 14px; }
.flow span { font-size: 12px; color: var(--muted); }
.flow .hot { border-color: var(--accent); background: var(--accent-soft); }
.triad { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 16px; align-items: center; }
@media (max-width: 560px) { .triad { grid-template-columns: 1fr; justify-items: center; } }
.triad svg { width: 200px; max-width: 100%; height: auto; }
.qa dt { font-weight: 700; margin-top: 10px; }
.qa dd { margin: 2px 0 0; color: var(--ink); }
.lb button { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); border: 0; border-radius: 999px; padding: 6px 14px; background: var(--surface); color: var(--ink); font-weight: 700; cursor: pointer; }
@media (prefers-reduced-motion: no-preference) { .deck, details.card { transition: border-color .15s; } }
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <a class="brand" href="#decks"><b>鳴潮：對決 牌組庫</b><span id="stamp"></span></a>
    <nav class="tabs" aria-label="分頁">
      <a href="#decks" data-v="decks">牌組</a>
      <a href="#missing" data-v="missing">缺牌</a>
      <a href="#collection" data-v="collection">收藏</a>
      <a href="#meta" data-v="meta">環境</a>

<section id="r-overview"><h2>1. 遊戲概觀</h2>
<ul>
<li>兩人對戰。每人準備一副<b>角色卡組</b>和一副剛好 40 張的<b>行動卡組</b>。</li>
<li>每人有 3 名角色站在角色區：前排 1 名<b>領隊</b>，後排 2 名<b>後台</b>。許多技能只在角色當領隊時有效。</li>
<li>雙方生命都從 <b>20</b> 開始，先把對手生命打到 0 的人獲勝。</li>
<li>每回合的核心是<b>對抗</b>：雙方各蓋一張行動卡，同時翻開，依顏色剋制決定勝負。勝方對敗方造成傷害；用紅色卡獲勝還能接著<b>連擊</b>。</li>
<li>手牌同時是攻擊手段、費用來源（放進協奏區）和角色升級的成本，怎麼分配手牌是整個遊戲的核心取捨。</li>
</ul>
<div class="triad">

<p>同色時：紅對紅、綠對綠比<b>速度值</b>，高的贏，一樣快就是回合方贏；藍對藍一律<b>平手</b>。</p>
<p class="small muted">所以紅色是爆發色（贏了能無限連擊），但會被藍色擋下；藍色適合防守；綠色剋藍，通常帶有抽牌或追擊效果。</p></div>
</div>
</section>

<section id="r-cards"><h2>2. 卡牌</h2>
<h3>角色卡</h3>
<ul>
<li><b>卡名</b>：規則和效果用來辨認角色。同名的卡算同一種角色。</li>
<li><b>等級</b>：0、1、2，升級時會參照。效果裡寫「等級 X 的「某角色」」就是指定那張。</li>
<li><b>標籤</b>：分成屬性（衍射、湮滅、氣動、導電、熱熔、冷凝）和武器類型（長刃、迅刀、佩槍、臂鎧、音感儀），卡面上可能以圖示呈現。</li>
<li><b>技能</b>：沒有特別說明時，只在這張卡位於角色區時有效。一張卡可能有多段技能，每段分開算。</li>
<li>卡圖、卡號、稀有度（C★～C★★★★★）不影響遊戲；卡號用來限制構築張數。</li>
</ul>
<h3>行動卡</h3>
<ul>
<li><b>顏色</b>：紅、藍、綠三種。效果要你宣言顏色時，只能從這三種選。</li>
<li><b>專屬角色名</b>：有寫的是該角色的專屬行動卡（例如【安可】的卡）；沒寫的是通用行動卡。</li>
<li><b>費用</b>：使用時要支付的點數，是 0 以上的整數。效果可以增減，但最低就是 0。</li>
<li><b>速度值</b>：同色對抗時比大小。<b>傷害值</b>：獲勝或連擊時造成的傷害。</li>
<li><b>技能</b>：沒有特別說明時，只在這張卡位於行動區時有效。</li>
<li>卡圖、稀有度（A★～A★★★）不影響遊戲。</li>
</ul>
<h3>技能文字的寫法</h3>
<ul>
<li>「己方」指這張卡的控制者；「此卡」指這張卡本身；括號（ ）內是補充說明，不產生效果。</li>
<li>「「卡名」」指定特定卡名的卡；「&lt;標籤&gt;」指定帶有該標籤的卡；「【角色】的卡」指該角色的專屬行動卡。</li>
<li><b>持有者</b>是把這張卡放進牌組帶來比賽的人；<b>控制者</b>是這張卡目前所在區域的擁有者。</li>
</ul>
</section>

<section id="r-build"><h2>3. 牌組構築</h2>
<h3>角色卡組（3～15 張）</h3>
<ul>
<li>只能放角色卡，而且剛好是 <b>3 種角色</b>。</li>
<li>每種角色都要放、而且只能放 <b>1 張 Lv0</b>。</li>
<li>同一卡號最多 1 張；總張數 3～15 張都合法，不必放滿。</li>
</ul>
<h3>行動卡組（剛好 40 張）</h3>
<ul>
<li>只能放行動卡，而且必須剛好 40 張。</li>
<li>只能放<b>通用行動卡</b>，以及<b>角色卡組裡有的角色</b>的專屬行動卡。</li>
<li>同一卡號最多 <b>3 張</b>。異畫卡（同卡號、不同稀有度）共用同一個卡號，合計計算。</li>
</ul>
<p class="ex">例：角色卡組裡有「安可」，行動卡組才能放【安可】的卡。</p>
<p class="ex">所有卡都必須是官方正版。店鋪賽事另規定只能使用簡體中文版卡牌，並禁止影印卡、自製卡等替代品。</p>
<div class="warnbox small">賽事守則的判罰範例寫「相同編號的卡牌不多於 4 張」，和《綜合規則書》的「最多 3 張」不一致；構築請以綜合規則書的 3 張為準。</div>
</section>

<section id="r-zones"><h2>4. 場地區域</h2>
<p>每人各有 7 個區域。任何區域裡有幾張卡，雙方都可以隨時確認。卡從一個區域移到另一個區域時，視為一張「新的卡」，原本區域套用在它身上的效果不會帶過去。</p>
<div class="tablewrap"><table>
<thead><tr><th>區域</th><th>公開／非公開</th><th>說明</th></tr></thead>
<tbody>
<tr><td>行動卡組區</td><td>非公開</td><td>行動卡組背面朝上疊放。沒有效果允許時，不能看、也不能改順序。要移動多張時一張一張移。</td></tr>
<tr><td>角色卡組區</td><td>非公開</td><td>放角色卡組，背面朝上。自己可以隨時看自己的角色卡組，對手只能確認張數。</td></tr>
<tr><td>手牌</td><td>非公開</td><td>自己可以隨時看、隨意排序；對手只能知道張數。</td></tr>
<tr><td>角色區</td><td>公開</td><td>前排 1 個<b>領隊位</b>、後排 2 個<b>後台位</b>。開局後角色都正面朝上。</td></tr>
<tr><td>行動區</td><td>非公開</td><td>對抗與連擊用的卡放這裡，從左往右排，新卡放最右邊，不能改順序，張數無上限。正面朝上的卡雙方都能看。</td></tr>
<tr><td>協奏區</td><td>公開</td><td>支付費用用的卡，<b>正面朝上、橫放</b>，張數無上限。</td></tr>
<tr><td>棄牌區</td><td>公開</td><td>被丟棄的卡。雙方隨時可看，自己可以調整自己棄牌區的順序。</td></tr>
</tbody></table></div>
<h3>角色疊放</h3>
<ul>
<li>升級時新角色卡會疊在原角色上方。下方的卡<b>技能仍然有效</b>，和最上面那張視為同一張卡、同一個位置。</li>
<li>在角色區內把卡移到別張角色的上方或下方，不算移動區域。效果要參照下方的卡時，才把它當成單獨的一張。</li>
<li>疊好的順序除非效果允許，否則不能改。</li>
</ul>
<h3>卡的擺放方式</h3>
<ul>
<li>沒有特別說明時，卡移到非公開區域就背面朝上，移到公開區域就正面朝上；背面翻成正面稱為「翻開」。</li>
<li>卡預設直放；只有協奏區的卡要橫放。</li>
</ul>
</section>

<section id="r-setup"><h2>5. 開局準備</h2>
<ol>
<li>雙方準備符合構築規則的角色卡組和行動卡組。</li>
<li>把角色卡組放在角色卡組區。洗自己的行動卡組，再交給對手洗，之後放回行動卡組區。</li>
<li>用雙方同意的公平方式（擲骰、猜拳等）決定誰有<b>先後攻選擇權</b>，由他決定自己先攻或後攻。</li>
<li>從角色卡組拿出 3 張 Lv0 角色，<b>背面朝上</b>放在領隊位和兩個後台位，順序自己決定。</li>
<li>從行動卡組上方抽 5 張作為起手。看完手牌後，<b>先攻方先</b>決定要不要重新調度，接著才輪到後攻方。
<p class="ex">重新調度：選任意張手牌，以任意順序放回行動卡組最下面，再從上面抽同樣張數，最後洗切行動卡組。每人只有一次機會。</p></li>
<li>雙方同時翻開角色區的卡，用生命計數器、計算機或紙筆把生命設為 20。</li>
<li>由先攻方開始第一個回合，之後雙方輪流。<b>整場遊戲的第一個回合只抽 1 張卡</b>。</li>
</ol>
<p class="ex">賽事中，雙方確認過對方的角色之後就不能再更換牌組內容。</p>
</section>

<section id="r-turn"><h2>6. 回合流程</h2>
<p>每個回合由回合方依序進行 5 個階段：</p>
<div class="flow">
<div><b>① 回合開始</b><span>觸發「回合開始時」技能</span></div>
<div><b>② 抽卡</b><span>抽 2 張（整場第一回合抽 1）</span></div>
<div><b>③ 行動</b><span>切換、升級、充能各一次</span></div>
<div class="hot"><b>④ 對抗</b><span>對抗 → 判定 → 連擊</span></div>
<div><b>⑤ 回合結束</b><span>清空行動區、手牌上限 8</span></div>
</div>
<p>每個階段一開始會觸發寫著該時點的技能（例如「己方抽卡階段開始時」），處理完才繼續。</p>
<h3>① 回合開始階段</h3>
<p>觸發「回合開始時／己方回合開始時／對方回合開始時」的技能並處理。</p>
<h3>② 抽卡階段</h3>
<p>觸發「抽卡階段開始時」的技能並處理，然後回合方抽 2 張卡（整場遊戲的第一個回合改抽 1 張），再處理抽卡引發的事件。</p>
<h3>③ 行動階段</h3>
<p>觸發「行動階段開始時」的技能後，回合方可以做下面三件事，<b>每件一回合限一次</b>，順序自由，也可以不做：</p>
<ul>
<li><b>切換角色</b>：把領隊和其中一名後台交換位置（兩個後台之間不能互換）。換了位置的角色會觸發【切換】。</li>
<li><b>升級</b>：選角色區的一名角色當「升級源」，從角色卡組公開一張<b>同名</b>、等級<b>相同或高 1 級</b>的角色卡當「升級目標」，<b>丟棄與升級目標等級相同張數的手牌</b>，再把它疊到升級源上方。
<ul>
<li>升級後，最上面那張的【登場】技能、下方各張的【升級】技能都會觸發。</li>
<li>例：升到 Lv1 要丟 1 張手牌、升到 Lv2 要丟 2 張；手牌不夠就不能選那張當目標。不能降級，Lv0 也不能直接跳 Lv2。</li>
<li>一名角色最多疊 5 張，疊滿 5 張就不能再當升級源。</li>
</ul></li>
<li><b>充能</b>：把 1 張手牌放進協奏區（橫放、公開），之後可以用來支付費用。</li>
</ul>
<p>做完後宣告結束行動階段，並選擇<b>進入對抗階段</b>，或<b>跳過對抗直接進入回合結束</b>。</p>
<h3>⑤ 回合結束階段</h3>
<ol>
<li>觸發「回合結束時／己方回合結束時／對方回合結束時」的技能並處理。</li>
<li>把<b>雙方行動區的所有卡</b>放進各自的棄牌區，再處理引發的事件。</li>
<li>回合方手牌超過 8 張時，自己選卡丟棄到剩 8 張。</li>
<li>回合結束，換對手成為回合方。</li>
</ol>
</section>

<section id="r-clash"><h2>7. 對抗階段</h2>
<h3>對抗步驟</h3>
<ol>
<li>觸發「對抗階段開始時」的技能。</li>
<li><b>回合方必須</b>從手牌選 1 張可以使用的行動卡，背面朝上放進行動區。手牌裡真的沒有可用的卡時，要公開全部手牌給對手確認，這次就不放。</li>
<li><b>非回合方可以選擇</b>放 1 張，也可以不放。</li>
<li>雙方翻開剛才放的卡，並<b>同時支付</b>這些卡的費用。</li>
<li>觸發角色卡的【對抗】技能，再觸發對抗卡的【對抗】技能，然後處理。</li>
</ol>
<p class="ex">「可以使用」指符合使用條件的卡，例如【領隊技】卡必須由它的專屬角色擔任領隊。翻開時就要付費，記得確認協奏區夠不夠。</p>
<h3>判定步驟</h3>
<div class="tablewrap"><table>
<thead><tr><th>情況</th><th>結果</th></tr></thead>
<tbody>
<tr><td>只有一方放了卡</td><td>有放卡的一方獲勝</td></tr>
<tr><td>雙方都沒放卡</td><td>平手</td></tr>
<tr><td>顏色不同</td><td>紅勝綠、綠勝藍、藍勝紅</td></tr>
<tr><td>紅對紅、綠對綠</td><td>速度值高的獲勝；速度相同時<b>回合方</b>獲勝</td></tr>
<tr><td>藍對藍</td><td>平手</td></tr>
</tbody></table></div>
<ol>
<li>判定後，觸發角色卡的【判定】技能，再觸發對抗卡的【判定】技能，然後處理。</li>
<li><b>平手</b>：對抗階段直接結束，進入回合結束階段。平手時不會觸發「勝利／失敗時」的技能。</li>
<li><b>分出勝負</b>：勝方對敗方造成等於<b>自己對抗卡傷害值</b>的傷害。</li>
<li>決定這回合能不能連擊：
<ul>
<li>勝方是用<b>紅色卡</b>贏的 → 本回合連擊次數<b>無上限</b>。</li>
<li>有【追擊 X】的條件達成 → 本回合連擊次數 <b>+X</b>（多個追擊可以疊加）。</li>
</ul></li>
</ol>
<h3>連擊步驟</h3>
<ol>
<li>只有<b>對抗的勝方</b>可以連擊，非回合方贏了也可以。沒有連擊次數或不想連擊，就宣告結束對抗階段。</li>
<li>每次連擊：消耗 1 次連擊次數 → 支付費用，從手牌打出 1 張<b>紅色行動卡</b>放進行動區。</li>
<li>觸發這張卡的【連擊】技能並處理，接著對對手造成這張卡的傷害值。</li>
<li>回到第 1 步，看要不要繼續。</li>
</ol>
<p class="ex">藍色或綠色卡獲勝時，只有靠【追擊】才有連擊次數；而且連擊只能打紅色卡。</p>
</section>

<section id="r-cost"><h2>8. 費用與協奏區</h2>
<ul>
<li><b>支付 X 點費用</b>＝從自己的協奏區選任意 X 張卡移到棄牌區。</li>
<li>需要支付的時機：對抗步驟<b>翻開對抗卡時</b>（雙方同時付），以及連擊時<b>打出卡的時候</b>。</li>
<li>協奏區的卡來自行動階段的<b>充能</b>（每回合 1 次），以及各種卡牌效果（例如把牌庫頂的卡放進協奏區）。</li>
<li>協奏區張數沒有上限；效果造成的費用增減，最低就是 0。</li>
</ul>
</section>

<section id="r-win"><h2>9. 傷害、生命與勝負</h2>
<h3>傷害</h3>
<ul>
<li>「造成 X 點傷害」沒寫對象時，是對<b>對手</b>；「受到 X 點傷害」沒寫對象時，是<b>技能的控制者自己</b>。受到傷害就是生命減少。</li>
<li>受到 0 點傷害視為沒有受到傷害。原本要造成 1 點以上、被其他效果減到 0 時，不算成功造成傷害，「造成傷害時」的技能不會觸發。</li>
<li>傷害來源：對抗或連擊的傷害，來源是那張行動卡；技能造成的傷害，來源是寫著該技能的卡。</li>
<li>數值只用 0 和正整數：算出小數時捨去小數，算出負數時視為 0，無法定義的數值視為 0。</li>
</ul>
<h3>勝負</h3>
<ul>
<li>規則檢查時，生命為 0 的玩家<b>敗北</b>。</li>
<li>規則檢查時，<b>行動卡組區和棄牌區都沒有卡</b>的玩家也敗北。</li>
<li>兩人同時符合敗北條件就是平手。</li>
<li>有些卡牌效果會直接判定勝負，處理完立刻結束遊戲，不必等規則檢查；同時讓雙方勝利或敗北也是平手。</li>
<li>玩家可以隨時投降，投降立刻敗北。</li>
</ul>
</section>

<section id="r-rebuild"><h2>10. 牌庫用完時（重構卡組）</h2>
<ul>
<li>規則檢查時，行動卡組區沒有卡的玩家，要把棄牌區所有卡背面朝上移回行動卡組區並洗切，這叫<b>重構卡組</b>。</li>
<li>效果處理到一半需要抽卡、但牌庫沒卡時：先暫停，重構卡組，再繼續處理。</li>
<li>其他效果在處理中途讓牌庫變空時，等這個效果處理完才重構。</li>
</ul>
<p class="ex">例：要抽 2 張但牌庫只剩 1 張 → 先抽 1 張，牌庫空了，重構卡組，再抽第 2 張。</p>
<p class="ex">例：效果要翻開牌庫頂 5 張但只剩 2 張 → 翻 2 張處理完，牌庫變空，接著重構卡組。</p>
</section>

<section id="r-ability"><h2>11. 技能與處理順序</h2>
<h3>技能的三種類型</h3>
<ul>
<li><b>觸發型</b>：寫著觸發時機（【登場】【升級】【判定】【切換】【對抗】【連擊】或「～時」）。條件達成時進入「待處理」，之後統一處理。觸發後即使來源卡離開原本區域，效果仍照常處理。同一個動作多次滿足同一個觸發條件，只算觸發一次。</li>
<li><b>永續型</b>：有效期間一直生效；寫著「若～」的條件不成立時不生效。會改變卡牌數值的永續效果，卡進入受影響區域時就已經是改過的數值。
<p class="ex">例：角色有「己方的紅色卡傷害 +1」，連擊打出一張原本 1 傷的紅卡，它進入行動區時就是 2 傷。</p></li>
<li><b>規則型</b>：改變構築或遊戲規則的技能，在所有區域都有效，不受其他效果影響；影響構築的在組牌時就生效。</li>
</ul>
<h3>技能在哪裡有效</h3>
<p>沒有特別說明時，角色卡的技能只在角色區有效、行動卡的技能只在行動區有效（規則型除外）。</p>
<p class="ex">例：棄牌區的「釋羽·閃避」不會自己觸發回收效果；它必須在行動區才有效。</p>
<h3>待處理事項的處理順序</h3>
<ol>
<li>先做<b>規則檢查</b>：判定勝負，然後在牌庫空時重構卡組。</li>
<li><b>回合方</b>從自己的待處理技能中挑一個處理，處理完回到第 1 步；直到回合方沒有待處理技能。</li>
<li>接著<b>非回合方</b>用同樣方式處理自己的待處理技能。</li>
<li>雙方都沒有了，就結束。</li>
</ol>
<p class="ex">所以同時觸發時，回合方的技能會全部先處理完，才輪到非回合方。</p>
<h3>處理原則</h3>
<ul>
<li>卡牌效果和遊戲規則衝突時，以<b>卡牌效果</b>為準。一個效果要你做某事、另一個效果禁止，以<b>禁止</b>為準。</li>
<li>效果只有一部分做得到時，做得到的部分照做。「做 A。之後，做 B」的寫法，A 沒有完整做到就不做 B。</li>
<li>要求做 X 次時，盡量做到 X 次或做不了為止；要求 0 次或負數次就不做。</li>
<li>已經是某種狀態的卡，被要求「變成該狀態」時不處理，「變成該狀態時」的條件也不算成立。</li>
<li>要求雙方同時選擇、展示或放置時，回合方先做、非回合方後做，結果視為同時。</li>
<li>從手牌、牌庫等非公開區域選「指定條件的卡」（卡名、種類、標籤、顏色等）時，要把選到的卡給對手看；選「不限條件的卡」時，只要讓對手確認張數。</li>
<li>「獲得技能」就是把該技能加進那張卡的技能文字，原本沒有技能的卡也能獲得。</li>
<li>「1 回合 X 次」表示這個技能每回合最多觸發 X 次。</li>
</ul>
</section>

<section id="r-keywords"><h2>12. 關鍵字辭典</h2>
<div class="tablewrap"><table>
<thead><tr><th>關鍵字</th><th>意思</th></tr></thead>
<tbody>
<tr><td><span class="kbd">【追擊 X】</span></td><td>本回合己方可連擊次數 +X。</td></tr>
<tr><td><span class="kbd">【領隊技】</span></td><td>己方領隊是這張卡的專屬角色時才能使用（包含在對抗步驟蓋出，和連擊時打出）。</td></tr>
<tr><td><span class="kbd">【領隊】</span></td><td>這張角色卡在領隊位時，這段技能才有效。</td></tr>
<tr><td><span class="kbd">【登場】</span></td><td>這張角色卡被放到角色區某名角色的最上方時觸發。開局放 Lv0 不算登場；放到角色下方也不算。</td></tr>
<tr><td><span class="kbd">【升級】</span></td><td>這張卡當作升級源、被新的角色卡疊上去時觸發。</td></tr>
<tr><td><span class="kbd">【切換】</span></td><td>這名角色因切換而改變位置時觸發（切成領隊或切到後台都算）。</td></tr>
<tr><td><span class="kbd">【對抗】</span></td><td>對抗步驟翻開對抗卡後觸發。</td></tr>
<tr><td><span class="kbd">【判定】</span></td><td>判定步驟決定勝負後觸發。</td></tr>
<tr><td><span class="kbd">【連擊】</span></td><td>用這張卡連擊時觸發。</td></tr>
<tr><td><span class="kbd">【優勢】</span></td><td>上一個回合己方在對抗中獲勝，或對方跳過了對抗階段時，這段技能才有效。整場第一個回合不會生效。</td></tr>
<tr><td><span class="kbd">【己方回合開始時】</span></td><td>己方回合開始時觸發。</td></tr>
<tr><td><span class="kbd">【各回合結束時】</span></td><td>雙方的每個回合結束時都會觸發。</td></tr>
<tr><td><span class="kbd">【己方回合結束時】</span></td><td>己方回合結束時觸發。</td></tr>
<tr><td><span class="kbd">【己方對抗階段開始時】</span></td><td>己方的對抗階段開始時觸發。</td></tr>
<tr><td><span class="kbd">【各對抗階段結束時】</span></td><td>雙方的每個對抗階段結束時都會觸發。</td></tr>
</tbody></table></div>
<h3>動作用語</h3>
<div class="tablewrap"><table>
<thead><tr><th>用語</th><th>意思</th></tr></thead>
<tbody>
<tr><td>抽卡</td><td>把行動卡組最上面 1 張加入手牌，再做一次規則檢查。「抽 X 張」就是重複 X 次。用其他方式把牌庫的卡加入手牌不算抽卡。</td></tr>
<tr><td>丟棄</td><td>從手牌把卡移到棄牌區。</td></tr>
<tr><td>公開</td><td>把非公開區域的卡給雙方看，卡不會因此換區域。</td></tr>
<tr><td>切換（切換領隊）</td><td>把領隊和一名後台交換位置。</td></tr>
<tr><td>登場</td><td>把角色卡放到角色區任一位置的最上方。</td></tr>
<tr><td>升級</td><td>把升級目標疊到升級源上方。透過效果升級時，未指定升級源可選任一角色；未指定目標時要選同名、等級相同或高 1 的卡；除非效果要求，否則不用丟手牌。</td></tr>
<tr><td>支付費用</td><td>把協奏區的卡移到棄牌區，X 點費用移 X 張。</td></tr>
<tr><td>重構卡組</td><td>棄牌區的卡全部背面朝上放回行動卡組區並洗切。</td></tr>
<tr><td>洗切</td><td>把卡堆隨機重排，讓任何人都不知道順序。</td></tr>
</tbody></table></div>
</section>

<section id="r-faq"><h2>13. 常見問題</h2>
<p class="small muted">整理自官方 FAQ（2026-09-12），用自己的話改寫。</p>
<dl class="qa">
<dt>角色卡組一定要放滿 15 張嗎？</dt><dd>不用。只要剛好 3 種角色、各有一張 Lv0，總數在 3～15 張之間就合法。</dd>
<dt>只有 1 張手牌，可以用規則升級成 Lv2 嗎？</dt><dd>不行。規則升級時，手牌張數必須至少等於升級目標的等級，升 Lv2 要有 2 張以上手牌。</dd>
<dt>角色已經是 Lv2，可以疊一張 Lv1 上去嗎？</dt><dd>不行。升級目標只能是同名、等級相同或高 1 的卡。</dd>
<dt>自己的回合可以不放對抗卡嗎？</dt><dd>回合方一旦宣告進入對抗階段就必須放；真的沒有可用的卡時要公開手牌證明。若想避免對抗，請在行動階段結束時選擇跳過對抗。</dd>
<dt>回合方沒放對抗卡時，對手還能放嗎？對手的回合我可以不放嗎？</dt><dd>都可以。非回合方本來就可以選擇放或不放。只有一方放卡時，放卡的一方獲勝。</dd>
<dt>平手會觸發「勝利／失敗時」的技能嗎？</dt><dd>不會。</dd>
<dt>可以讓兩名後台互換位置嗎？</dt><dd>不行。切換一定是領隊和一名後台交換。</dd>
<dt>多個【追擊】會疊加嗎？</dt><dd>會。例如角色的【追擊 3】和對抗卡的【追擊 2】同時成立，本回合連擊次數就 +5。</dd>
<dt>對抗步驟中，先用效果把某角色切上領隊，他的【領隊】【對抗】技能會觸發嗎？</dt><dd>不會。【對抗】技能在翻開對抗卡的那一刻就一起觸發；那時這名角色還在後台，他的【領隊】技能無效，所以不會觸發。</dd>
<dt>對抗步驟就被效果打到 0 血，還會判定對抗勝負嗎？</dt><dd>不會。生命歸 0 的玩家立刻敗北，遊戲直接結束。</dd>
<dt>「讓己方紅色卡獲得某技能」這類效果，棄牌區的卡也會獲得嗎？</dt><dd>會，所有區域裡符合條件的卡都會獲得。但行動卡的技能只在行動區有效，所以實際上只有打進行動區的卡會發揮作用。</dd>
<dt>「下回合對方紅色卡費用 +1」會影響棄牌區的卡嗎？</dt><dd>會。效果期間，對方所有區域的紅色卡在需要參照費用時都 +1。</dd>
<dt>寫著「造成傷害時」的卡，用別的卡造成傷害也會觸發嗎？</dt><dd>不會，只有那張卡自己造成傷害時才觸發。</dd>
<dt>找卡效果找不到指定的卡怎麼辦？</dt><dd>宣告牌庫裡沒有那張卡，然後照效果繼續處理（例如直接洗切卡組）。</dd>
<dt>只寫「可以」的效果，公開了卡就一定要加入手牌嗎？</dt><dd>是。像「可以公開牌庫頂 1 張並加入手牌」，選擇公開之後就必須加入手牌。</dd>
</dl>
</section>

<section id="r-event"><h2>14. 賽事守則重點</h2>
<p class="small muted">整理自《官方賽賽事守則》（2026-09-12），主要針對娛樂級賽事；各場比賽另有公告時以公告為準。</p>
<ul>
<li><b>禮儀</b>：開打前後互相問好；清楚宣告操作和效果；碰對方的卡或看對方公開區域前先取得同意；除非效果允許，不能看對手的手牌和牌庫；有疑問就叫裁判，並以裁判的解釋為準。完成的合法操作不能自行撤回。</li>
<li><b>卡牌</b>：只能用該賽事允許的卡，禁止影印或自製卡；卡面有可辨識的折痕、污損時，裁判可以禁用（套上卡套後看不出差異就可以用）。競技級賽事中，新卡號發售或發放未滿 7 天不能使用。</li>
<li><b>卡套</b>：行動卡組全部用外觀一致的不透明卡套、同方向、一套一張；最多套 2 層，層數和順序要一致，且至少一層不透明。角色卡組也要用一致的不透明卡套，而且要和行動卡組的卡套不同。</li>
<li><b>道具</b>：可用生命計數器；可用「UCP對戰卡牌助手」小程式代替道具，但手機要放桌上讓對手和裁判看得到，並關閉通話與通知。</li>
<li><b>洗牌</b>：在對手看得到的地方於合理時間內洗勻，不能看牌、不能傷卡；洗完交給對手切牌或再洗，之後自己不能再動。</li>
<li><b>時間</b>：建議每局 30 分鐘。時間到還沒分出勝負時，一般判雙方都輸；淘汰賽等不能雙敗時，依序比：
<ol><li>生命值高的獲勝；</li><li>手牌、協奏區、行動區的卡合計多的獲勝；</li><li>所有卡洗回行動卡組，雙方用牌庫頂第一張對抗，直到分出勝負。</li></ol></li>
<li><b>判罰</b>：由輕到重分為提醒、警告、敗北、失去資格、出場中止，累犯會加重。
<ul>
<li>例：不小心多抽牌（提醒，由裁判隨機抽回洗入）。</li>
<li>例：開賽後 5 分鐘內才入座（警告）；超過 5 分鐘未入座（敗北）。</li>
<li>例：牌組不符構築規則，或與提交的卡表不符（敗北）。</li>
<li>例：串通操縱比賽結果、作弊偷看或換牌（失去資格）。</li>
</ul></li>
</ul>
</section>

    bindSteppers(document.getElementById("misslist"), function () { drawWants(); draw(); });
    document.getElementById("wantlist").addEventListener("click", function (e) {
      var b = e.target.closest("[data-unwant]"); if (!b) return;
      toggleWant(b.dataset.unwant);
      if (!MY.wants.length) { renderMissing(); return; }
      app.querySelector("#wantlist").closest("section").querySelector("h2 .num").textContent = MY.wants.length + " 套";
      drawWants(); draw();
    });
    app.querySelectorAll("[data-mode]").forEach(function (b) {
      b.addEventListener("click", function () { miss.mode = b.dataset.mode; app.querySelectorAll("[data-mode]").forEach(function (x) { x.setAttribute("aria-pressed", x === b); }); draw(); });
    });
    document.getElementById("mchars").addEventListener("change", function (e) { miss.chars = e.target.checked; draw(); });
    document.getElementById("mdone").addEventListener("change", function (e) { miss.showDone = e.target.checked; draw(); });
    document.getElementById("cpmiss").addEventListener("click", function () {
      var rows = computeMissing(), d = new Date();
      var lines = ["《鳴潮：對決》缺牌清單（" + d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0") + "）",
        "想組：" + MY.wants.map(function (id) { return groupLabel(byId[id]) + " " + byId[id].name; }).join("、"),
        "計算方式：" + (miss.mode === "sum" ? "同時組好全部（張數相加）" : "輪流組（取最多的一套）") + (miss.chars ? "，含角色卡" : "，不含角色卡")];
      var total = 0;
      MISS_GROUPS.forEach(function (g) {
        var rs = rows.filter(g[1]).filter(function (r) { return r.lack > 0; }).sort(function (a, b) { return a.code < b.code ? -1 : 1; });
        if (!rs.length) return;
        lines.push("", "【" + g[0] + "】");
        rs.forEach(function (r) { total += r.lack; lines.push(r.code + " " + cardLabel(r.card) + " ×" + r.lack); });
      });
      lines.push("", total ? "共缺 " + total + " 張" : "全部湊齊");
      copyText(lines.join("\n"), this, "複製缺牌清單");
    });
  }

  /* ---------------- sync link import ---------------- */
  function renderSync(code) {
    var p;
    try { p = decodeSync(code); } catch (e) { p = null; }
    function leave() { try { history.replaceState(null, "", location.pathname + location.search + "#collection"); } catch (e) {} go("#collection"); }
    if (!p) {
      app.innerHTML = '<div class="eyebrow">SYNC</div><h1>同步連結無法讀取</h1><div class="notice bad" style="margin-top:16px">這個連結可能不完整，請回到原本的裝置重新產生並完整複製。</div><p><a href="#collection">前往收藏</a></p>';
      return;
    }
    app.innerHTML = '<div class="eyebrow">SYNC</div><h1>匯入同步資料</h1>' +
      '<div class="notice" style="margin-top:16px"><p>連結裡的資料：' + esc(summarize(p)) + "<br>這台裝置目前：" + esc(summarize(MY)) + "</p>" +
      '<p class="small muted">匯入後會取代這台裝置目前的收藏與想組牌組。</p>' +
      '<div class="row"><button type="button" class="btn primary" id="syncyes">匯入並取代</button><button type="button" class="btn" id="syncno">不要匯入</button></div></div>';
    document.getElementById("syncyes").addEventListener("click", function () { MY.have = p.have; MY.wants = p.wants; saveMy(); leave(); });
    document.getElementById("syncno").addEventListener("click", leave);
  }

  /* ---------------- meta ---------------- */
  function pct(x) { return (x * 100).toFixed(1) + "%"; }
  function lineupTable(rows, matches, opts) {
    var maxU = Math.max.apply(null, rows.map(function (r) { return r[2] || 0; })) || 1;
    return '<div class="tablewrap"><table><thead><tr><th>名次</th><th>陣容</th><th class="n">使用</th><th>使用率</th><th class="n">勝率</th><th class="n">勝／負</th><th class="n">玩家</th></tr></thead><tbody>' +
      rows.map(function (r) {
        var uses = r[2] || 0, w = r[3] || 0, l = r[4] || 0, dr = r[5] || 0;
        var wr = uses ? w / (w + l + dr) : null;
        var cls = wr === null ? "" : (wr >= 0.53 ? "wr-good" : (wr < 0.47 ? "wr-bad" : ""));
        return "<tr><td class=\"n\">" + esc(r[0] == null ? "—" : r[0]) + "</td><td>" + esc(r[1]) + "</td><td class=\"n\">" + uses.toLocaleString() + "</td>" +
          '<td class="n" style="text-align:left"><span class="ubar" style="width:' + Math.round(uses / maxU * 80) + 'px"></span>' + pct(uses / (2 * matches)) + "</td>" +
          '<td class="n ' + cls + '">' + (wr === null ? "—" : pct(wr)) + "</td><td class=\"n\">" + w + "／" + l + "</td><td class=\"n\">" + (r[6] == null ? "—" : r[6]) + "</td></tr>";
      }).join("") + "</tbody></table></div>" + (opts || "");
  }
  function renderMeta() {
    var E = D.env;
    var s6 = E.sim1106, s1 = E.sim1014;
    app.innerHTML = '<div class="eyebrow">METAGAME</div><h1>環境</h1><p class="lede">線上數據取自同人模擬器（mc.sldark.com，現為 wuwatcg.com），只代表線上對局；實體賽紀錄另列。</p><div class="stack" style="margin-top:16px">' +
      '<section class="panel"><h2>11 月線上前 20 名陣容</h2><p class="small muted">統計截止 ' + esc(s6.cutoff) + "・有效對局 " + Number(s6.matches).toLocaleString() + " 場・玩家 " + s6.players + " 人。" + esc(s6.range) +
      " 使用率＝使用次數 ÷（對局 × 2）。勝率 ≥53% 標綠、<47% 標紅。</p>" + lineupTable(s6.rows, s6.matches) + '<p class="small">' + link(s6.url, "統計來源") + "</p></section>" +
      '<section class="panel"><h2>' + esc(E.cup1101.title) + '</h2><div class="tablewrap"><table><thead><tr><th>四強席次</th><th>角色組合</th><th>主辦觀察</th></tr></thead><tbody>' +
      E.cup1101.rows.map(function (r) { return '<tr><td class="n">' + esc(r[0]) + "</td><td>" + esc(r[1]) + "</td><td>" + esc(r[2]) + "</td></tr>"; }).join("") +
      "</tbody></table></div>" + '<p class="small">' + link(E.cup1101.report, "主辦戰報") + "　" + link(E.cup1101.photos, "四強牌表照片") + "</p></section>" +
      '<div class="grid2"><section class="panel"><h2>' + esc(E.official.title) + '</h2><p class="small muted">' + esc(E.official.posted) + " 發布，共 " + E.official.matches + " 場。" + esc(E.official.note) + '</p><ol class="list">' +
      E.official.rows.map(function (r) { return "<li>" + esc(r[1]) + "</li>"; }).join("") + "</ol><p class=\"small\">" + link(E.official.url, "官方微博") + "</p></section>" +
      '<section class="panel"><h2>第一屆網站賽</h2><p class="small muted">' + esc(E.webcup.title) + "。" + esc(E.webcup.note) + '</p><div class="tablewrap"><table><tbody>' +
      E.webcup.rows.map(function (r) { return "<tr><td>" + esc(r[0]) + "</td><td>" + esc(r[1]) + "</td><td>" + esc(r[2]) + "</td></tr>"; }).join("") + "</tbody></table></div><p class=\"small\">" + link(E.webcup.url, "決賽直播回放") + "</p></section></div>" +
      '<section class="panel"><h2>中日韓店賽冠軍紀錄</h2><div class="tablewrap"><table><thead><tr><th>日期</th><th>地區</th><th>賽事</th><th>人數</th><th>冠軍陣容</th><th>戰績</th><th>核實狀態</th></tr></thead><tbody>' +
      E.stores.map(function (r) {
        return '<tr><td class="mono">' + esc(r.date) + "</td><td>" + esc(r.region) + "</td><td>" + (r.url ? link(r.url, r.event) : esc(r.event)) + "</td><td class=\"n\">" + esc(r.players || "—") + "</td><td>" + esc(r.lineup) + "</td><td>" + esc(r.record || "—") + '</td><td class="small muted">' + esc(r.verified) + "</td></tr>";
      }).join("") + "</tbody></table></div></section>" +
      '<section class="panel"><details class="fold"><summary>含守岸人的 28 種陣容（11/6）</summary>' + lineupTable(D.shore1106, s6.matches) + '<p class="small muted">與上方前 20 名同一快照（13:39）。</p></details></section>' +
      '<section class="panel"><details class="fold"><summary>含今汐的 28 種陣容（11/6）</summary>' + lineupTable(D.jin1106, 5121) + '<p class="small muted">今汐陣容為 16:36 的另一份快照（5,121 場），與上方數字略有差異。</p></details></section>' +
      '<section class="panel"><details class="fold"><summary>10/14 線上前 20 名（舊快照）</summary><p class="small muted">統計截止 ' + esc(s1.cutoff) + "・有效對局 " + Number(s1.matches).toLocaleString() + " 場</p>" + lineupTable(s1.rows, s1.matches) + "</details></section>" +
      "</div>";
  }

  /* ---------------- about ---------------- */
  function renderAbout() {
    app.innerHTML = '<div class="eyebrow">ABOUT</div><h1>說明與來源</h1><p class="lede">本頁由 Excel 研究檔「鳴潮對決_牌組研究」產生的靜態快照，資料更新到 ' + esc(D.generated) + "。</p>" +
      '<div class="stack" style="margin-top:16px"><section class="panel"><h2>收藏與缺牌資料存在哪裡</h2><p style="margin:6px 0 0">你在「收藏」登記的卡和選的想組牌組，只存在目前這個瀏覽器，不會上傳到任何地方。每台電腦、每支手機各存一份；換裝置時到「收藏 → 備份與同步」產生同步連結，或下載備份檔。清除瀏覽器的網站資料會一併清掉，建議偶爾下載備份。</p></section>' +
      '<section class="panel"><h2>資料日期與注意事項</h2><dl class="plan">' +
      D.notes.map(function (n) { return "<div><dt>" + esc(n[0]) + "</dt><dd>" + esc(n[1]) + "</dd></div>"; }).join("") +
      '</dl></section><section class="panel"><h2>資料來源</h2><ul class="list">' +
      D.sources.map(function (s) { return "<li>" + link(s[1], s[0]) + "</li>"; }).join("") + "</ul></section></div>";
  }

  /* ---------------- router ---------------- */
  function route() {
    var h = (current || "#decks").slice(1);
    var view = h.indexOf("deck-") === 0 ? "decks" : (h.indexOf("sync=") === 0 ? "collection" : h);
    if (["decks", "missing", "collection", "meta", "cards", "rules", "about"].indexOf(view) < 0) view = "decks";
    document.querySelectorAll(".tabs a").forEach(function (a) { if (a.dataset.v === view) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    if (h.indexOf("sync=") === 0) renderSync(h.slice(5));
    else if (h.indexOf("deck-") === 0) renderDeck(h.slice(5).toUpperCase());
    else if (view === "missing") renderMissing();
    else if (view === "collection") renderCollection();
    else if (view === "rules") app.innerHTML = document.getElementById("tpl-rules").innerHTML;
    else if (view === "meta") renderMeta();
    else if (view === "cards") renderCards();
    else if (view === "about") renderAbout();
    else renderDecks();
  }
  app.addEventListener("click", function (e) {
    var b = e.target.closest("[data-copy]");
    if (b) {
      var t = b.dataset.copy;
      var done = function () { b.textContent = "已複製"; setTimeout(function () { b.textContent = "複製"; }, 1500); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, function () { selectText(b.previousElementSibling); });
      else selectText(b.previousElementSibling);
    }
    var f = e.target.closest("a[data-find]");
    if (f) { cst.q = f.dataset.find; cst.color = cst.product = cst.kind = "all"; }
    var art = e.target.closest("[data-art]");
    if (art) {
      var fig = art.closest(".cfig");
      fig.querySelector(".cimg").src = art.dataset.art;
      fig.querySelectorAll("[data-art]").forEach(function (x) { x.setAttribute("aria-pressed", x === art); });
    }
    var z = e.target.closest("[data-zoom]");
    if (z) openLightbox(z.currentSrc || z.src, z.alt);
    var w = e.target.closest("[data-want]");
    if (w && !w.closest("#list") && !w.closest("#wantlist")) {
      var on = toggleWant(w.dataset.want);
      w.setAttribute("aria-pressed", on); w.textContent = on ? "已加入想組" : "＋ 想組";
      var row = document.getElementById("wantrow");
      if (row) {
        var lk = row.querySelector('a[href="#missing"]');
        if (on && !lk) row.insertAdjacentHTML("beforeend", '<a class="small" href="#missing">看缺牌清單 →</a>');
        if (!on && lk) lk.remove();
      }
    }
  });
  var lb = document.getElementById("lb"), lbimg = document.getElementById("lbimg");
  function openLightbox(src, alt) { lbimg.src = src; lbimg.alt = alt || ""; lb.hidden = false; document.getElementById("lbclose").focus(); }
  function closeLightbox() { lb.hidden = true; lbimg.removeAttribute("src"); }
  lb.addEventListener("click", closeLightbox);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !lb.hidden) closeLightbox(); });
  function selectText(el) { try { var r = document.createRange(); r.selectNodeContents(el); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) {} }
  // In-page navigation: switch views directly so it also works where the address bar cannot change (local files, previews).
  var current = location.hash || "#decks";
  function go(h) {
    current = h;
    try { if (location.hash !== h) history.pushState(null, "", h); } catch (e) { /* address bar may be read-only */ }
    route();
    window.scrollTo(0, 0);
  }
  document.addEventListener("click", function (e) {
    var a = e.target.closest('a[href^="#"]');
    if (!a || e.defaultPrevented || e.metaKey || e.ctrlKey) return;
    e.preventDefault();
    if (a.dataset.jump) {
      var target = document.getElementById(a.dataset.jump);
      if (target) target.scrollIntoView({ behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
      return;
    }
    go(a.getAttribute("href"));
  });
  window.addEventListener("hashchange", function () { current = location.hash || "#decks"; route(); });
  window.addEventListener("popstate", function () { current = location.hash || "#decks"; route(); });
  route();
})();
</script>
